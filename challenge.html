<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#f472b6" />
  <link rel="manifest" href="/manifest.json" />
  <title>حصالتي — My Piggy Bank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
  <script src="i18n.js"></script>
  <script src="theme.js"></script>
  <style>
    :root {
      --green: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, var(--pink-soft) 0%, var(--pink-light) 45%, var(--pink-muted) 100%);
      font-family: "Inter", sans-serif; color: var(--text);
      display: flex; flex-direction: column; align-items: center; padding: 24px 16px 40px;
    }
    .top-bar {
      align-self: flex-start; max-width: 680px; width: 100%;
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }
    .top-bar a { color: var(--pink-dark); text-decoration: none; font-size: 0.85rem; font-weight: 500; }
    .top-bar-actions { display: flex; gap: 10px; align-items: center; }
    .top-bar-actions button, .top-bar-actions a.btn-sm {
      background: var(--pink-light); border: 1px solid var(--pink-muted); color: var(--pink-dark);
      font-size: 0.78rem; padding: 5px 12px; border-radius: 99px; cursor: pointer;
      font-family: inherit; font-weight: 600; text-decoration: none;
    }
    .board {
      width: 100%; max-width: 680px; background: var(--white);
      border-radius: 24px; box-shadow: var(--shadow-lg);
      padding: 28px 24px 20px; border: 2px solid var(--pink-light);
    }
    .view-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; gap: 12px;
    }
    .view-header h1 { font-family: "Amiri", serif; font-size: 1.8rem; color: var(--pink-dark); }
    .btn-pink {
      background: var(--pink); color: white; border: none; padding: 10px 20px;
      border-radius: 99px; font-size: 0.85rem; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn-pink:hover { background: var(--pink-dark); }
    .plans-list { display: flex; flex-direction: column; gap: 12px; }
    .plan-card {
      background: var(--pink-soft); border: 2px solid var(--pink-light); border-radius: 16px;
      padding: 16px 18px; cursor: pointer; transition: transform 0.12s, border-color 0.15s;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .plan-card:hover { transform: translateY(-2px); border-color: var(--pink); }
    .plan-card-info h3 { font-size: 0.95rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .plan-card-info p { font-size: 0.78rem; color: var(--text-muted); }
    .plan-card-progress { text-align: end; min-width: 70px; }
    .plan-card-progress .pct { font-size: 1.2rem; font-weight: 800; color: var(--green); }
    .plan-card-progress .saved { font-size: 0.72rem; color: var(--text-muted); }
    .mini-bar { height: 6px; background: var(--pink-light); border-radius: 99px; margin-top: 6px; overflow: hidden; }
    .mini-bar-fill { height: 100%; background: var(--green); border-radius: 99px; }
    .plan-setup {
      background: var(--pink-soft); border-radius: 16px; padding: 24px;
      border: 1px solid var(--pink-light); margin-bottom: 20px;
    }
    .plan-setup h2 { font-family: "Amiri", serif; font-size: 1.3rem; color: var(--pink-dark); margin-bottom: 8px; }
    .plan-setup p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px; }
    .plan-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .plan-form.full { grid-template-columns: 1fr; }
    .plan-form label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
    .plan-form input {
      width: 100%; padding: 11px 14px; border: 2px solid var(--pink-light);
      border-radius: 12px; font-size: 0.95rem; font-family: inherit; outline: none;
    }
    .plan-form input:focus { border-color: var(--pink); }
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; gap: 12px; }
    .goal-number { font-size: clamp(2rem, 8vw, 3rem); font-weight: 800; color: var(--pink-dark); line-height: 1; }
    .goal-currency { font-size: 1rem; font-weight: 600; color: var(--pink); }
    .goal-label { font-size: 0.75rem; color: var(--text-muted); }
    .plan-name { font-family: "Amiri", serif; font-size: 1.4rem; color: var(--pink-dark); }
    .plan-info { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; font-size: 0.82rem; color: var(--text-muted); }
    .plan-info span { background: var(--pink-soft); padding: 5px 12px; border-radius: 99px; }
    .progress-section {
      background: var(--pink-soft); border-radius: 16px; padding: 14px 16px;
      margin-bottom: 20px; border: 1px solid var(--pink-light);
    }
    .progress-stats { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.85rem; color: var(--text-muted); }
    .progress-stats .saved { font-size: 1.1rem; font-weight: 700; color: var(--green); }
    .progress-bar-track { height: 10px; background: var(--pink-light); border-radius: 99px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #16a34a, var(--green)); border-radius: 99px; transition: width 0.4s; }
    .progress-remaining { margin-top: 8px; font-size: 0.78rem; color: var(--text-muted); text-align: center; }
    .grid { display: grid; gap: 8px; }
    .cell {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-size: clamp(0.6rem, 2.2vw, 0.85rem); font-weight: 700; cursor: pointer;
      border-radius: 50%; position: relative; background: var(--pink-light); color: var(--pink-dark);
      border: 2px solid transparent; font-family: inherit;
    }
    .cell:hover:not(.checked) { background: var(--pink-muted); transform: scale(1.05); }
    .cell.checked { background: rgba(34, 197, 94, 0.12); border-color: rgba(34, 197, 94, 0.35); }
    .cell.checked .amount { opacity: 0.2; }
    .cell .check {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--green); opacity: 0; transform: scale(0.4); transition: opacity 0.2s, transform 0.25s;
    }
    .cell.checked .check { opacity: 1; transform: scale(1); }
    .footer { margin-top: 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .reset-btn {
      background: var(--pink-light); border: 1px solid var(--pink-muted); color: var(--pink-dark);
      font-size: 0.72rem; padding: 6px 14px; border-radius: 99px; cursor: pointer; font-family: inherit; font-weight: 600;
    }
    .btn-delete-plan { background: none; border: 1px solid #fecaca; color: #ef4444; }
    .celebration {
      position: fixed; inset: 0; background: var(--overlay, rgba(30,41,59,0.45));
      display: flex; align-items: center; justify-content: center; z-index: 100;
      opacity: 0; pointer-events: none; transition: opacity 0.4s;
    }
    .celebration.show { opacity: 1; pointer-events: all; }
    .celebration-box {
      background: var(--white); border: 2px solid var(--green); border-radius: 24px;
      padding: 36px 48px; text-align: center;
    }
    .celebration-box h2 { font-family: "Amiri", serif; font-size: 1.8rem; color: var(--pink-dark); margin-bottom: 8px; }
    .celebration-box button {
      background: var(--green); border: none; color: white; padding: 10px 28px;
      border-radius: 99px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 12px;
    }
    .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 10px; display: none; }
    .error-msg.show { display: block; }
    .empty-plans { text-align: center; padding: 32px 16px; color: var(--text-muted); }
    .empty-plans p { margin-bottom: 16px; font-size: 0.9rem; }
    .hidden { display: none !important; }
    .streak-banner { background: linear-gradient(90deg, #fef3c7, #fde68a); border: 2px solid #fcd34d; border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; font-size: 0.85rem; display: flex; align-items: center; gap: 10px; }
    .templates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    @media (max-width: 520px) { .templates { grid-template-columns: repeat(2, 1fr); } }
    .template-btn { background: var(--white); border: 2px solid var(--pink-light); border-radius: 12px; padding: 10px 8px; cursor: pointer; font-family: inherit; font-size: 0.75rem; text-align: center; transition: border-color .15s; }
    .template-btn:hover { border-color: var(--pink); }
    .template-btn .icon { font-size: 1.4rem; display: block; margin-bottom: 4px; }
    .partial-row { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
    .partial-row input { flex: 1; padding: 10px 14px; border: 2px solid var(--pink-light); border-radius: 12px; font-family: inherit; }
    .partial-row button { white-space: nowrap; }
    .milestone-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--white); border: 2px solid var(--green); border-radius: 16px; padding: 14px 24px; box-shadow: var(--shadow-lg); z-index: 150; font-weight: 600; color: var(--pink-dark); opacity: 0; transition: opacity .3s; pointer-events: none; }
    .milestone-toast.show { opacity: 1; }
    @media (max-width: 520px) { .plan-form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" data-i18n="home">← Home</a>
    <div class="top-bar-actions">
      <a href="dashboard.html" class="btn-sm" data-i18n="dashboard">لوحة التحكم</a>
      <span id="userLabel" style="font-size:0.78rem;color:var(--text-muted)"></span>
      <a href="admin.html" id="adminLink" class="btn-sm" style="display:none" data-i18n="admin">Admin</a>
      <button type="button" class="lang-toggle">EN</button>
      <button type="button" class="settings-btn" id="openSettingsBtn" title="Settings">⚙️</button>
      <button id="logoutBtn" data-i18n="logout">Logout</button>
    </div>
  </div>

  <div class="board">
    <div id="plansListView">
      <div class="view-header">
        <h1 data-i18n="myPlans">خططي</h1>
        <button class="btn-pink" id="showCreateBtn" data-i18n="newPlan">+ خطة جديدة</button>
      </div>

      <div id="streakBanner" class="streak-banner hidden"><span>🔥</span><span id="streakText"></span></div>

      <div id="createFormWrap" class="plan-setup hidden">
        <h2 data-i18n="createNewPlan">أنشئ خطة جديدة</h2>
        <p data-i18n="noLimit">لا يوجد حد — أنشئ أي عدد من خطط التوفير</p>
        <p style="font-size:0.78rem;font-weight:600;color:var(--text-muted);margin-bottom:8px" data-i18n="templates">قوالب جاهزة</p>
        <div class="templates" id="templatesGrid"></div>
        <form id="planForm">
          <div class="plan-form full">
            <div>
              <label for="nameInput" data-i18n="planNameOptional">اسم الخطة (اختياري)</label>
              <input type="text" id="nameInput" data-i18n-placeholder="planNamePlaceholder" placeholder="مثال: سيارة جديدة" maxlength="50" />
            </div>
          </div>
          <div class="plan-form">
            <div>
              <label for="goalInput" data-i18n="amountKD">المبلغ (KD)</label>
              <input type="number" id="goalInput" min="10" max="50000" placeholder="500" required />
            </div>
            <div>
              <label for="daysInput" data-i18n="days">عدد الأيام</label>
              <input type="number" id="daysInput" min="1" max="365" placeholder="30" required />
            </div>
          </div>
          <button type="submit" class="btn-pink" style="width:100%;padding:14px" data-i18n="createPlan">إنشاء الخطة ✨</button>
          <div class="error-msg" id="planError"></div>
        </form>
      </div>

      <div id="plansList" class="plans-list">
        <div class="empty-plans"><p data-i18n="loading">Loading...</p></div>
      </div>
    </div>

    <div id="boardView" class="hidden">
      <button class="reset-btn" id="backBtn" style="margin-bottom:16px" data-i18n="allPlans">← كل الخطط</button>
      <header class="header">
        <div>
          <div class="goal-number"><span id="goalDisplay">0</span><span class="goal-currency"> KD</span></div>
          <div class="goal-label" data-i18n="goalLabel">الهدف — Kuwaiti Dinar</div>
        </div>
        <div class="plan-name" id="planName"></div>
      </header>
      <div class="plan-info">
        <span id="daysInfo">📅 0 days</span>
        <span id="dailyInfo">💰 ~0 KD/day</span>
        <span id="cellsInfo">🎯 0 slots</span>
      </div>
      <section class="progress-section">
        <div class="progress-stats">
          <span><span data-i18n="saved">موفر</span>: <span class="saved" id="savedAmount">0 KD</span></span>
          <span id="percentText">0%</span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="progress-remaining" id="remainingText"></div>
      </section>
      <div class="partial-row">
        <input type="number" id="partialInput" min="1" max="500" data-i18n-placeholder="partialPlaceholder" placeholder="مبلغ KD" />
        <button type="button" class="btn-pink" id="partialBtn" data-i18n="addPartial">إضافة</button>
      </div>
      <div class="grid" id="grid"></div>
      <footer class="footer">
        <button class="reset-btn" id="exportBtn" data-i18n="exportPlan">تصدير CSV</button>
        <button class="reset-btn" id="resetBtn" data-i18n="resetProgress">Reset progress</button>
        <button class="reset-btn btn-delete-plan" id="deletePlanBtn" data-i18n="deletePlan">حذف الخطة</button>
      </footer>
    </div>
  </div>

  <div class="celebration" id="celebration">
    <div class="celebration-box">
      <div style="font-size:3rem">🎉</div>
      <h2 data-i18n="congrats">مبروك!</h2>
      <p id="celebrationText">Goal reached!</p>
      <button id="closeCelebration" data-i18n="continue">Continue</button>
    </div>
  </div>

  <div class="milestone-toast" id="milestoneToast"></div>

  <div class="settings-modal-overlay hidden" id="settingsModal">
    <div class="settings-modal" role="dialog" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle" data-i18n="themeSettings">إعدادات المظهر</h2>
      <p data-i18n="themeSettingsDesc">اختر اللون المناسب — وردي، أزرق، أو داكن</p>
      <div id="themePicker"></div>
      <div class="theme-saved" id="themeSavedMsg" data-i18n="themeSaved">تم حفظ المظهر ✓</div>
      <button type="button" class="settings-modal-close" id="closeSettingsBtn" data-i18n="close">إغلاق</button>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="settings.js"></script>
  <script src="onboarding.js"></script>
  <script>
    const CURRENCY = "KD";
    let plan = null;
    let saveTimer = null;

    function formatAmount(n) { return `${n} ${CURRENCY}`; }
    function cellKey(r, c) { return `${r}-${c}`; }

    function getSavedTotal() {
      if (!plan) return 0;
      let total = 0;
      plan.grid.forEach((row, r) => row.forEach((amt, c) => {
        if (plan.checked[cellKey(r, c)]) total += amt;
      }));
      Object.values(plan.partials || {}).forEach((v) => { total += Number(v) || 0; });
      return total;
    }

    async function loadStreak() {
      try {
        const data = await apiFetch(`/api/dashboard?lang=${getLang()}`);
        const banner = document.getElementById("streakBanner");
        if (data.streak > 0) {
          banner.classList.remove("hidden");
          document.getElementById("streakText").textContent = t("streakDays").replace("{n}", data.streak);
        } else {
          banner.classList.add("hidden");
        }
      } catch { /* ignore */ }
    }

    async function loadTemplates() {
      try {
        const data = await apiFetch(`/api/templates?lang=${getLang()}`);
        document.getElementById("templatesGrid").innerHTML = data.templates.map((tpl) => `
          <button type="button" class="template-btn" data-id="${tpl.id}" data-goal="${tpl.goal}" data-days="${tpl.days}">
            <span class="icon">${tpl.icon}</span>${escapeHtml(tpl.name)}
          </button>`).join("");
        document.querySelectorAll(".template-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            document.getElementById("goalInput").value = btn.dataset.goal;
            document.getElementById("daysInput").value = btn.dataset.days;
            document.getElementById("nameInput").value = btn.textContent.trim();
            document.getElementById("createFormWrap").classList.remove("hidden");
          });
        });
      } catch { /* ignore */ }
    }

    function showMilestoneToast(msg) {
      const el = document.getElementById("milestoneToast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 3500);
    }

    function milestoneMessage(pct) {
      if (pct === 25) return t("milestone25");
      if (pct === 50) return t("milestone50");
      if (pct === 75) return t("milestone75");
      if (pct === 100) return t("milestone100");
      return `${pct}%`;
    }

    function showPlansList() {
      document.getElementById("plansListView").classList.remove("hidden");
      document.getElementById("boardView").classList.add("hidden");
      plan = null;
      loadPlansList();
    }

    function showBoard(p) {
      plan = p;
      if (!plan.checked) plan.checked = {};
      if (!plan.partials) plan.partials = {};
      document.getElementById("plansListView").classList.add("hidden");
      document.getElementById("boardView").classList.remove("hidden");
      document.getElementById("goalDisplay").textContent = plan.goal;
      document.getElementById("planName").textContent = plan.name || t("appName");
      document.getElementById("daysInfo").textContent = `📅 ${plan.days} ${t("daysLabel")}`;
      document.getElementById("dailyInfo").textContent = `💰 ~${plan.dailyTarget} ${t("perDay")}`;
      document.getElementById("cellsInfo").textContent = `🎯 ${plan.grid.flat().length} ${t("slots")}`;
      buildGrid();
      updateProgress();
    }

    async function loadPlansList() {
      const container = document.getElementById("plansList");
      container.innerHTML = `<div class="empty-plans"><p data-i18n="loading">${t("loading")}</p></div>`;
      try {
        const data = await apiFetch("/api/plans");

        if (!data.plans.length) {
          container.innerHTML = `
            <div class="empty-plans">
              <p>${t("noPlansYet")}</p>
              <button class="btn-pink" onclick="document.getElementById('showCreateBtn').click()">${t("newPlan")}</button>
            </div>`;
          return;
        }

        container.innerHTML = data.plans.map(p => `
          <div class="plan-card" data-id="${p.id}">
            <div class="plan-card-info">
              <h3>${escapeHtml(p.name)}</h3>
              <p>${p.goal} KD · ${p.days} ${t("daysLabel")} · ${new Date(p.created_at).toLocaleDateString(getLang() === "ar" ? "ar-KW" : "en")}</p>
            </div>
            <div class="plan-card-progress">
              <div class="pct">${p.pct}%</div>
              <div class="saved">${p.saved} KD</div>
              <div class="mini-bar"><div class="mini-bar-fill" style="width:${p.pct}%"></div></div>
            </div>
          </div>`).join("");

        container.querySelectorAll(".plan-card").forEach(card => {
          card.addEventListener("click", () => openPlan(card.dataset.id));
        });
      } catch (err) {
        container.innerHTML = `<div class="empty-plans"><p style="color:#ef4444">${escapeHtml(err.message)}</p></div>`;
      }
    }

    async function openPlan(id) {
      try {
        const data = await apiFetch(`/api/plans/${id}`);
        showBoard(data.plan);
      } catch (err) {
        alert(err.message);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function updateProgress() {
      const saved = getSavedTotal();
      const goal = plan.goal;
      const pct = Math.min(100, Math.round((saved / goal) * 100));
      const remaining = Math.max(0, goal - saved);

      document.getElementById("savedAmount").textContent = formatAmount(saved);
      document.getElementById("percentText").textContent = pct + "%";
      document.getElementById("progressFill").style.width = pct + "%";
      document.getElementById("remainingText").textContent =
        remaining === 0 ? t("goalReached") : `${formatAmount(remaining)} ${t("remaining")}`;

      if (saved >= goal) {
        document.getElementById("celebrationText").textContent = `${formatAmount(goal)}!`;
        document.getElementById("celebration").classList.add("show");
      }
    }

    function buildGrid() {
      const gridEl = document.getElementById("grid");
      gridEl.innerHTML = "";
      const cols = plan.grid[0]?.length || 11;
      gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

      plan.grid.forEach((row, r) => row.forEach((amount, c) => {
        const key = cellKey(r, c);
        const cell = document.createElement("button");
        cell.className = "cell" + (plan.checked[key] ? " checked" : "");
        cell.innerHTML = `<span class="amount">${amount}</span><span class="check">✓</span>`;
        cell.addEventListener("click", () => {
          plan.checked[key] = !plan.checked[key];
          if (!plan.checked[key]) delete plan.checked[key];
          cell.classList.toggle("checked", !!plan.checked[key]);
          updateProgress();
          scheduleSave();
        });
        gridEl.appendChild(cell);
      }));
    }

    function scheduleSave(extra = {}) {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          const res = await apiFetch(`/api/plans/${plan.id}/check`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ checked: plan.checked, partials: plan.partials || {}, ...extra }),
          });
          if (res.plan) {
            plan.partials = res.plan.partials || plan.partials;
            plan.milestones_shown = res.plan.milestones_shown;
          }
          (res.newMilestones || []).forEach((m) => showMilestoneToast(milestoneMessage(m)));
          if (res.newBadges?.length) showMilestoneToast("🏅 " + t("newBadge"));
          if (res.saved !== undefined) updateProgressFromSaved(res.saved, res.pct);
          loadStreak();
        } catch { /* silent retry on next click */ }
      }, 400);
    }

    function updateProgressFromSaved(saved, pct) {
      const goal = plan.goal;
      const remaining = Math.max(0, goal - saved);
      document.getElementById("savedAmount").textContent = formatAmount(saved);
      document.getElementById("percentText").textContent = pct + "%";
      document.getElementById("progressFill").style.width = pct + "%";
      document.getElementById("remainingText").textContent =
        remaining === 0 ? t("goalReached") : `${formatAmount(remaining)} ${t("remaining")}`;
      if (saved >= goal) {
        document.getElementById("celebrationText").textContent = `${formatAmount(goal)}!`;
        document.getElementById("celebration").classList.add("show");
      }
    }

    document.getElementById("partialBtn").addEventListener("click", () => {
      const amt = Math.round(Number(document.getElementById("partialInput").value));
      if (!amt || amt < 1) return;
      document.getElementById("partialInput").value = "";
      scheduleSave({ partialAmount: amt });
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      if (!plan) return;
      const rows = [["amount", "saved", "cell"]];
      plan.grid.forEach((row, r) => row.forEach((amt, c) => {
        const key = cellKey(r, c);
        rows.push([amt, plan.checked[key] ? "yes" : "no", key]);
      }));
      Object.entries(plan.partials || {}).forEach(([k, v]) => rows.push([v, "partial", k]));
      const csv = rows.map((r) => r.join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${(plan.name || "plan").replace(/\s+/g, "-")}.csv`;
      a.click();
    });

    document.getElementById("showCreateBtn").addEventListener("click", () => {
      document.getElementById("createFormWrap").classList.toggle("hidden");
    });

    document.getElementById("planForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("planError");
      errEl.classList.remove("show");

      try {
        const data = await apiFetch("/api/plans", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            goal: document.getElementById("goalInput").value,
            days: document.getElementById("daysInput").value,
            name: document.getElementById("nameInput").value,
          }),
        });
        document.getElementById("planForm").reset();
        document.getElementById("createFormWrap").classList.add("hidden");
        showBoard(data.plan);
      } catch (err) {
        errEl.textContent = err.message || t("createFailed");
        errEl.classList.add("show");
      }
    });

    document.getElementById("backBtn").addEventListener("click", showPlansList);
    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm(t("resetConfirm"))) return;
      plan.checked = {};
      plan.partials = {};
      scheduleSave();
      buildGrid();
      updateProgress();
      document.getElementById("celebration").classList.remove("show");
    });

    document.getElementById("deletePlanBtn").addEventListener("click", async () => {
      if (!confirm(t("deleteConfirm"))) return;
      try {
        await apiFetch(`/api/plans/${plan.id}`, { method: "DELETE" });
        showPlansList();
      } catch (err) {
        alert(err.message);
      }
    });

    document.getElementById("closeCelebration").addEventListener("click", () => {
      document.getElementById("celebration").classList.remove("show");
    });

    document.getElementById("logoutBtn").addEventListener("click", logout);

    const settingsModal = document.getElementById("settingsModal");
    document.getElementById("openSettingsBtn").addEventListener("click", async () => {
      settingsModal.classList.remove("hidden");
      await initThemeSettings("themePicker");
    });
    document.getElementById("closeSettingsBtn").addEventListener("click", () => {
      settingsModal.classList.add("hidden");
    });
    settingsModal.addEventListener("click", (e) => {
      if (e.target === settingsModal) settingsModal.classList.add("hidden");
    });
    document.getElementById("themePicker").addEventListener("click", (e) => {
      if (e.target.closest(".theme-option")) {
        const msg = document.getElementById("themeSavedMsg");
        msg.classList.add("show");
        setTimeout(() => msg.classList.remove("show"), 2000);
      }
    });

    document.addEventListener("langchange", () => {
      loadTemplates();
      loadStreak();
      if (plan) showBoard(plan);
      else loadPlansList();
      if (!settingsModal.classList.contains("hidden")) initThemeSettings("themePicker");
    });

    requireAuth().then(user => {
      if (!user) return;
      document.getElementById("userLabel").textContent = user.username;
      if (user.role === "admin") document.getElementById("adminLink").style.display = "inline";
      initOnboarding();
      loadTemplates();
      loadStreak();
      showPlansList();
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").then((reg) => {
        reg.update().catch(() => {});
      }).catch(() => {});
    }
  </script>
</body>
</html>
