<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول — حصالتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
  <script src="i18n.js"></script>
  <script src="theme.js"></script>
  <style>
    :root {
      --pink: #f472b6;
      --pink-dark: #ec4899;
      --pink-light: #fce7f3;
      --pink-soft: #fdf2f8;
      --pink-muted: #fbcfe8;
      --text: #1e293b;
      --text-muted: #64748b;
      --white: #ffffff;
      --red: #ef4444;
      --shadow-lg: 0 20px 60px rgba(244, 114, 182, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      background: linear-gradient(160deg, var(--pink-soft) 0%, var(--pink-light) 45%, var(--pink-muted) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--white);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: var(--shadow-lg);
      border: 2px solid var(--pink-light);
      position: relative;
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-wrap svg { width: 56px; height: 56px; margin-bottom: 12px; }

    .logo-wrap h1 {
      font-family: "Amiri", serif;
      font-size: 2rem;
      color: var(--pink-dark);
    }

    .logo-wrap p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--pink-light);
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.15s;
      outline: none;
    }

    input:focus {
      border-color: var(--pink);
    }

    .btn-login {
      width: 100%;
      background: var(--pink);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 99px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      margin-top: 8px;
      transition: background 0.15s, transform 0.12s;
      box-shadow: 0 4px 14px rgba(244, 114, 182, 0.35);
    }

    .btn-login:hover { background: var(--pink-dark); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .error {
      background: #fef2f2;
      color: var(--red);
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }

    .error.show { display: block; }

    .back {
      text-align: center;
      margin-top: 20px;
    }

    .back a {
      color: var(--pink-dark);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .back a:hover { text-decoration: underline; }

    .hint {
      margin-top: 20px;
      padding: 12px;
      background: var(--pink-soft);
      border-radius: 10px;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <div style="position:absolute;top:14px;left:14px;display:flex;gap:8px">
      <button type="button" class="lang-toggle">EN</button>
      <button class="theme-toggle" data-i18n-title="darkMode" title="Dark mode">🌙</button>
    </div>
    <div class="logo-wrap">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <ellipse cx="32" cy="38" rx="22" ry="20" fill="#fbcfe8"/>
        <path d="M14 22 L20 8 L26 20 Z" fill="#f472b6"/>
        <path d="M38 20 L44 8 L50 22 Z" fill="#f472b6"/>
        <circle cx="24" cy="36" r="3" fill="#1e293b"/>
        <circle cx="40" cy="36" r="3" fill="#1e293b"/>
        <ellipse cx="32" cy="42" rx="3" ry="2" fill="#ec4899"/>
      </svg>
      <h1 data-i18n="appName">حصالتي</h1>
      <p data-i18n="loginTitle">تسجيل الدخول إلى حسابك</p>
    </div>

    <div class="error" id="error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username" data-i18n="username">اسم المستخدم</label>
        <input type="text" id="username" name="username" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password" data-i18n="password">كلمة المرور</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-login" id="submitBtn" data-i18n="loginBtn">دخول</button>
    </form>
    <p style="text-align:center;margin-top:12px">
      <button type="button" id="forgotBtn" style="background:none;border:none;color:var(--pink-dark);cursor:pointer;font-size:0.82rem;font-family:inherit" data-i18n="forgotPassword">نسيت كلمة المرور؟</button>
    </p>

    <div class="back">
      <a href="index.html" data-i18n="backHome">← العودة للصفحة الرئيسية</a>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const errorEl = document.getElementById("error");

    if (params.get("error") === "admin") {
      errorEl.textContent = t("adminRequired");
      errorEl.classList.add("show");
    }

    // Already logged in? redirect
    getCurrentUser().then(user => {
      if (user) {
        window.location.href = user.role === "admin" ? "admin.html" : "challenge.html";
      }
    });

    document.getElementById("forgotBtn").addEventListener("click", async () => {
      const username = document.getElementById("username").value.trim();
      if (!username) { errorEl.textContent = t("username"); errorEl.classList.add("show"); return; }
      try {
        await apiFetch("/api/password-reset-request", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username }),
        });
        errorEl.style.background = "#f0fdf4"; errorEl.style.color = "#166534"; errorEl.style.borderColor = "#bbf7d0";
        errorEl.textContent = t("resetRequested");
        errorEl.classList.add("show");
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add("show");
      }
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      errorEl.classList.remove("show");

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      try {
        const data = await apiFetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });

        window.location.href = data.user.role === "admin" ? "admin.html" : "challenge.html";
      } catch (err) {
        errorEl.textContent = err.message.includes("connect") || err.message.includes("fetch")
          ? t("connectError") : err.message || t("loginFailed");
        errorEl.classList.add("show");
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
