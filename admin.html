<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الإدارة — حصالتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
  <script src="i18n.js"></script>
  <script src="theme.js"></script>
  <style>
    :root {
      --admin-font: "IBM Plex Sans", "Cairo", sans-serif;
      --admin-display: "Cairo", "IBM Plex Sans", sans-serif;
      --green: #22c55e;
      --red: #ef4444;
      --success-bg: #f0fdf4;
      --success-text: #166534;
      --success-border: #bbf7d0;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --warn-bg: #fffbeb;
      --warn-border: #fde68a;
      --warn-text: #92400e;
      --badge-user-bg: #f0fdf4;
      --badge-user-text: #166534;
    }

    [data-theme="dark"] {
      --success-bg: #14532d;
      --success-text: #bbf7d0;
      --success-border: #166534;
      --error-bg: #450a0a;
      --error-border: #7f1d1d;
      --warn-bg: #422006;
      --warn-border: #a16207;
      --warn-text: #fde68a;
      --badge-user-bg: #14532d;
      --badge-user-text: #bbf7d0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: var(--admin-font);
      background: linear-gradient(160deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 45%, var(--bg-gradient-end) 100%);
      color: var(--text);
      padding: 24px 16px 40px;
      line-height: 1.5;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .top-bar h1 {
      font-family: var(--admin-display);
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--pink-dark);
      letter-spacing: -0.02em;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .top-actions a, .top-actions button {
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 99px;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      border: none;
      transition: background 0.15s, color 0.15s;
    }

    .btn-outline {
      background: var(--surface);
      color: var(--pink-dark);
      border: 2px solid var(--border-strong) !important;
    }

    .btn-outline:hover { background: var(--surface-alt); }

    .btn-logout {
      background: var(--pink);
      color: #fff;
    }

    [data-theme="dark"] .btn-logout {
      background: var(--primary-color);
      color: #fff;
    }

    .gender-filter {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .gender-filter label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .gender-filter select {
      padding: 8px 12px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 0.85rem;
      font-family: inherit;
      background: var(--input-bg);
      color: var(--text);
    }

    .gender-select {
      padding: 6px 10px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 0.78rem;
      font-family: inherit;
      background: var(--input-bg);
      color: var(--text);
      min-width: 100px;
    }

    .btn-logout:hover { filter: brightness(0.95); }

    .welcome {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .card {
      background: var(--surface);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow-lg);
      border: 2px solid var(--border);
      margin-bottom: 24px;
      color: var(--text);
    }

    .card h2 {
      font-family: var(--admin-display);
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--pink-dark);
    }

    .card p, .setup-steps {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.6;
      white-space: pre-line;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    @media (max-width: 520px) {
      .form-row { grid-template-columns: 1fr; }
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--text-muted);
    }

    .form-group input, .form-group select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      background: var(--input-bg);
      color: var(--text);
    }

    .form-group input:focus, .form-group select:focus, textarea:focus {
      border-color: var(--pink);
    }

    .btn-create {
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 99px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--primary-color) 35%, transparent);
      transition: filter 0.15s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-create:hover { filter: brightness(1.05); }
    .btn-create:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      filter: none;
    }

    .msg {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      display: none;
    }

    .msg.show { display: block; }
    .msg.success {
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }
    .msg.error {
      background: var(--error-bg);
      color: var(--red);
      border: 1px solid var(--error-border);
    }

    [data-theme="dark"] .msg.error { color: #fca5a5; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    th {
      text-align: start;
      padding: 10px 12px;
      border-bottom: 2px solid var(--border);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.78rem;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: middle;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .badge.admin { background: var(--pink-light); color: var(--pink-dark); }
    .badge.user { background: var(--badge-user-bg); color: var(--badge-user-text); }

    .btn-delete {
      background: transparent;
      border: 1px solid var(--error-border);
      color: var(--red);
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: inherit;
    }

    [data-theme="dark"] .btn-delete { color: #fca5a5; }

    .btn-delete:hover { background: var(--error-bg); }

    .empty {
      text-align: center;
      color: var(--text-muted);
      padding: 24px;
      font-size: 0.9rem;
    }

    .storage-banner {
      background: var(--warn-bg);
      border: 2px solid var(--warn-border);
      color: var(--warn-text);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .storage-banner.ok {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

    .storage-banner strong {
      display: block;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    #schemaSql, #importCsv {
      direction: ltr;
      text-align: left;
      unicode-bidi: isolate;
      white-space: pre;
      overflow-wrap: normal;
      word-break: normal;
      background: var(--input-bg);
      color: var(--text);
      border: 2px solid var(--border);
    }

    .setup-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .btn-secondary {
      background: var(--surface-alt);
      color: var(--pink-dark);
      border: 2px solid var(--pink);
      padding: 12px 24px;
      border-radius: 99px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-secondary:hover { filter: brightness(1.08); }

    .form-disabled-note {
      display: none;
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--warn-bg);
      color: var(--warn-text);
      border: 1px solid var(--warn-border);
      font-size: 0.85rem;
    }

    .form-disabled-note.show { display: block; }

    code {
      font-family: ui-monospace, Consolas, monospace;
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="storageBanner" class="storage-banner" style="display:none"></div>
    <div class="top-bar">
      <div>
        <h1 data-i18n="adminPanel">لوحة الإدارة</h1>
        <div class="welcome"><span data-i18n="welcome">مرحباً،</span> <span id="adminName">Admin</span></div>
      </div>
      <div class="top-actions">
        <button type="button" class="lang-toggle">EN</button>
        <button class="theme-toggle" data-i18n-title="darkMode" title="Dark mode">🌙</button>
        <a href="challenge.html" class="btn-outline" data-i18n="appName">حصالتي</a>
        <a href="index.html" class="btn-outline" data-i18n="home">الرئيسية</a>
        <button class="btn-logout" id="logoutBtn" data-i18n="logout">خروج</button>
      </div>
    </div>

    <div id="schemaSetup" class="card" style="display:none">
      <h2 id="dbSetupTitleLabel">🗄️ إعداد قاعدة البيانات</h2>
      <p class="setup-steps" id="dbSetupStepsLabel">1. افتح Supabase → SQL Editor → New query
2. انسخ الكود أدناه → Run
3. ارجع هنا واضغط «تحقق من الاتصال»</p>
      <a href="https://supabase.com/dashboard" target="_blank" rel="noopener" class="btn-create" id="openSupabaseBtn" style="margin-bottom:12px">فتح Supabase Dashboard</a>
      <textarea id="schemaSql" rows="12" readonly dir="ltr" spellcheck="false" style="width:100%;padding:10px;border-radius:10px;font-family:ui-monospace,Consolas,monospace;font-size:0.72rem;margin-bottom:10px;line-height:1.45"></textarea>
      <div class="setup-actions">
        <button type="button" class="btn-create" id="copySchemaBtn">نسخ SQL</button>
        <button type="button" class="btn-secondary" id="recheckDbBtn">تحقق من الاتصال</button>
      </div>
    </div>

    <div class="card" id="createUserCard">
      <div class="form-disabled-note" id="dbBlockedNote"></div>
      <form id="createForm">
        <div class="form-row">
          <div class="form-group">
            <label for="newUsername" data-i18n="username">اسم المستخدم</label>
            <input type="text" id="newUsername" required minlength="3" autocomplete="off" />
          </div>
          <div class="form-group">
            <label for="newPassword" data-i18n="password">كلمة المرور</label>
            <input type="password" id="newPassword" required minlength="6" autocomplete="new-password" />
          </div>
        </div>
        <div class="form-group" style="max-width:200px;margin-bottom:16px">
          <label for="newRole" data-i18n="role">الصلاحية</label>
          <select id="newRole">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button type="submit" class="btn-create" id="createUserBtn" data-i18n="createUserBtn">إنشاء المستخدم</button>
        <div class="msg" id="formMsg"></div>
      </form>
    </div>

    <div class="card">
      <h2 data-i18n="importUsers">استيراد مستخدمين (CSV)</h2>
      <p data-i18n="importHint">username,password,role</p>
      <textarea id="importCsv" rows="4" style="width:100%;padding:10px;border-radius:10px;font-family:ui-monospace,Consolas,monospace;font-size:0.82rem;margin-bottom:12px" placeholder="user1,pass123,user&#10;user2,pass456,user"></textarea>
      <button type="button" class="btn-create" id="importBtn" data-i18n="importBtn">استيراد</button>
      <div class="msg" id="importMsg"></div>
    </div>

    <div class="card">
      <h2 data-i18n="users">👥 المستخدمون</h2>
      <div class="gender-filter">
        <label for="genderFilter" data-i18n="filterByGender">تصفية حسب الجنس</label>
        <select id="genderFilter">
          <option value="all" data-i18n="genderAll">الكل</option>
          <option value="male" data-i18n="genderMale">ذكر</option>
          <option value="female" data-i18n="genderFemale">أنثى</option>
          <option value="unset" data-i18n="genderNotSet">غير محدد</option>
        </select>
      </div>
      <div id="usersTable">
        <div class="empty" data-i18n="loading">Loading...</div>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="activityLog">سجل النشاط</h2>
      <div id="activityTable"><div class="empty" data-i18n="loading">Loading...</div></div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    let currentUser = null;
    let dbReady = true;
    let allUsers = [];
    let genderFilter = "all";

    function genderLabel(gender) {
      if (gender === "male") return tt("genderMale", "Male");
      if (gender === "female") return tt("genderFemale", "Female");
      return tt("genderNotSet", "Not set");
    }

    function tt(key, fallback) {
      return typeof t === "function" ? t(key, fallback) : fallback;
    }

    function applySetupLabels() {
      document.getElementById("dbSetupTitleLabel").textContent = tt("dbSetupTitle", "🗄️ Database setup");
      document.getElementById("dbSetupStepsLabel").textContent = tt(
        "dbSetupSteps",
        "1. Open Supabase → SQL Editor → New query\n2. Copy the code below → Run\n3. Come back and click Check connection"
      );
      document.getElementById("openSupabaseBtn").textContent = tt("openSupabase", "Open Supabase Dashboard");
      document.getElementById("copySchemaBtn").textContent = tt("copySchema", "Copy SQL");
      document.getElementById("recheckDbBtn").textContent = tt("recheckDb", "Check connection");
    }

    function setCreateEnabled(enabled) {
      dbReady = enabled;
      const btn = document.getElementById("createUserBtn");
      const importBtn = document.getElementById("importBtn");
      const note = document.getElementById("dbBlockedNote");
      ["newUsername", "newPassword", "newRole"].forEach((id) => {
        document.getElementById(id).disabled = !enabled;
      });
      btn.disabled = !enabled;
      importBtn.disabled = !enabled;
      document.getElementById("importCsv").disabled = !enabled;
      if (!enabled) {
        note.textContent = tt("dbNotReady", "Fix the database before creating users");
        note.classList.add("show");
      } else {
        note.classList.remove("show");
      }
    }

    async function init() {
      currentUser = await requireAdmin();
      if (!currentUser) return;
      document.getElementById("adminName").textContent = currentUser.username;
      await checkStorage();
      loadUsers();
      loadActivity();
    }

    async function checkStorage() {
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        const banner = document.getElementById("storageBanner");
        const schemaCard = document.getElementById("schemaSetup");

        if (data.needsSchema || (!data.ok && data.storage === "supabase")) {
          banner.className = "storage-banner";
          banner.style.display = "block";
          banner.innerHTML =
            `<strong>${tt("storageSchemaTitle", "⚠️ Database setup required")}</strong>` +
            `<span>${tt("storageSchemaBody", "Supabase is connected but tables are missing. Run the SQL below, then click Check connection.")}</span>` +
            (data.hint || data.dbError ? `<br><small>${data.hint || data.dbError}</small>` : "");
          schemaCard.style.display = "block";
          applySetupLabels();
          loadSchemaSql();
          setCreateEnabled(false);
        } else if (!data.persistent) {
          banner.className = "storage-banner";
          banner.style.display = "block";
          banner.innerHTML =
            `<strong>${tt("storageWarningTitle", "⚠️ Storage is not persistent")}</strong>` +
            `<span>${tt("storageWarningBody", "Users and plans are lost when the server restarts. Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY in Vercel, then redeploy.")}</span>` +
            (data.hint ? `<br><small>${data.hint}</small>` : "");
          schemaCard.style.display = "none";
          setCreateEnabled(false);
        } else if (data.storage === "supabase" && data.ok) {
          banner.className = "storage-banner ok";
          banner.style.display = "block";
          banner.innerHTML =
            `<strong>${tt("storageOkTitle", "✅ Supabase connected")}</strong>` +
            `<span>${tt("storageOkBody", "Database is live — users and plans are saved permanently.")} (${data.db?.users ?? 0} ${tt("storageUsers", "users")})</span>`;
          schemaCard.style.display = "none";
          setCreateEnabled(true);
        } else {
          banner.style.display = "none";
          schemaCard.style.display = "none";
          setCreateEnabled(true);
        }
      } catch {
        setCreateEnabled(true);
      }
    }

    async function loadSchemaSql() {
      try {
        const data = await apiFetch("/api/schema");
        document.getElementById("schemaSql").value = data.sql || "";
      } catch {
        try {
          const res = await fetch("/api/setup/schema");
          const data = await res.json();
          document.getElementById("schemaSql").value = data.sql || "";
        } catch { /* ignore */ }
      }
    }

    document.getElementById("copySchemaBtn").addEventListener("click", async () => {
      const ta = document.getElementById("schemaSql");
      try {
        await navigator.clipboard.writeText(ta.value);
        const btn = document.getElementById("copySchemaBtn");
        const prev = btn.textContent;
        btn.textContent = tt("copied", "Copied!");
        setTimeout(() => { btn.textContent = prev; }, 1500);
      } catch {
        ta.select();
        document.execCommand("copy");
      }
    });

    document.getElementById("recheckDbBtn").addEventListener("click", async () => {
      await checkStorage();
      if (dbReady) {
        loadUsers();
        loadActivity();
      }
    });

    async function loadUsers() {
      const container = document.getElementById("usersTable");
      if (!dbReady) {
        container.innerHTML = `<div class="empty">${tt("dbNotReady", "Fix the database before creating users")}</div>`;
        return;
      }
      try {
        const data = await apiFetch("/api/users");
        allUsers = data.users;

        const filtered = allUsers.filter((u) => {
          if (genderFilter === "all") return true;
          if (genderFilter === "unset") return !u.gender;
          return u.gender === genderFilter;
        });

        if (filtered.length === 0) {
          container.innerHTML = `<div class="empty">${tt("noUsers", "No users yet.")}</div>`;
          return;
        }

        container.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>${tt("colUsername", "Username")}</th>
                <th>${tt("colRole", "Role")}</th>
                <th>${tt("colGender", "Gender")}</th>
                <th>${tt("colStatus", "Status")}</th>
                <th>${tt("colCreated", "Created")}</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${filtered.map(u => `
                <tr style="${u.disabled_at ? 'opacity:0.55' : ''}">
                  <td><strong>${escapeHtml(u.username)}</strong></td>
                  <td><span class="badge ${u.role}">${u.role}</span></td>
                  <td>
                    <select class="gender-select" data-id="${u.id}" data-username="${escapeHtml(u.username)}" data-prev="${u.gender || ""}">
                      <option value="" ${!u.gender ? "selected" : ""}>${tt("genderNotSet", "Not set")}</option>
                      <option value="male" ${u.gender === "male" ? "selected" : ""}>${tt("genderMale", "Male")}</option>
                      <option value="female" ${u.gender === "female" ? "selected" : ""}>${tt("genderFemale", "Female")}</option>
                    </select>
                  </td>
                  <td>${u.disabled_at ? `<span class="badge user">${tt("disabled", "Disabled")}</span>` : "—"}</td>
                  <td>${new Date(u.created_at).toLocaleDateString(getLang() === "ar" ? "ar-KW" : "en")}</td>
                  <td style="display:flex;gap:6px;flex-wrap:wrap">
                    ${u.id !== currentUser.id ? `
                      <button class="btn-delete btn-reset-pw" data-id="${u.id}" data-username="${escapeHtml(u.username)}" title="Reset PW">🔑</button>
                      ${u.disabled_at
                        ? `<button class="btn-outline btn-enable" data-id="${u.id}" style="padding:4px 10px;font-size:0.72rem">${tt("enable", "Enable")}</button>`
                        : `<button class="btn-delete btn-disable" data-id="${u.id}">${tt("disable", "Disable")}</button>`}
                      <button class="btn-delete" data-id="${u.id}" data-username="${escapeHtml(u.username)}">${tt("delete", "Delete")}</button>`
                      : `<span style="font-size:0.75rem;color:var(--text-muted)">${tt("you", "You")}</span>`}
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>`;

        container.querySelectorAll(".gender-select").forEach((sel) => {
          sel.addEventListener("change", () => changeGender(sel));
        });

        container.querySelectorAll(".btn-delete:not(.btn-disable):not(.btn-enable):not(.btn-reset-pw)").forEach((btn) => {
          if (!btn.dataset.username) return;
          btn.addEventListener("click", () => deleteUser(Number(btn.dataset.id), btn.dataset.username));
        });
        container.querySelectorAll(".btn-disable").forEach((btn) => {
          btn.addEventListener("click", () => toggleUser(Number(btn.dataset.id), "disable"));
        });
        container.querySelectorAll(".btn-enable").forEach((btn) => {
          btn.addEventListener("click", () => toggleUser(Number(btn.dataset.id), "enable"));
        });
        container.querySelectorAll(".btn-reset-pw").forEach((btn) => {
          btn.addEventListener("click", () => resetPassword(Number(btn.dataset.id), btn.dataset.username));
        });
      } catch (err) {
        const needsPatch = String(err.message || "").includes("disabled_at") || String(err.message || "").includes("gender");
        if (needsPatch) {
          document.getElementById("schemaSetup").style.display = "block";
          applySetupLabels();
          try {
            const res = await fetch("/api/setup/patch-gender");
            const patch = await res.json();
            document.getElementById("schemaSql").value = patch.sql || "";
          } catch {
            loadSchemaSql();
          }
        }
        container.innerHTML = `<div class="empty" style="color:var(--red)">${escapeHtml(err.message)}${err.hint ? `<br><small>${escapeHtml(err.hint)}</small>` : ""}</div>`;
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showMsg(text, type) {
      const el = document.getElementById("formMsg");
      el.textContent = text;
      el.className = `msg show ${type}`;
      setTimeout(() => el.classList.remove("show"), 5000);
    }

    document.getElementById("createForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!dbReady) {
        showMsg(tt("dbNotReady", "Fix the database before creating users"), "error");
        return;
      }
      const username = document.getElementById("newUsername").value.trim();
      const password = document.getElementById("newPassword").value;
      const role = document.getElementById("newRole").value;

      try {
        await apiFetch("/api/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, role }),
        });
        showMsg(tt("userCreated", "User created successfully!"), "success");
      } catch (err) {
        showMsg(err.hint ? `${err.message} — ${err.hint}` : err.message, "error");
        return;
      }
      document.getElementById("createForm").reset();
      loadUsers();
      loadActivity();
    });

    async function changeGender(selectEl) {
      const id = Number(selectEl.dataset.id);
      const username = selectEl.dataset.username;
      const prev = selectEl.dataset.prev || "";
      const next = selectEl.value;
      if (prev === next) return;

      const msg = tt("genderChangeConfirm", "Change {username}'s gender from {from} to {to}?")
        .replace("{username}", username)
        .replace("{from}", genderLabel(prev || null))
        .replace("{to}", genderLabel(next || null));

      if (!confirm(msg)) {
        selectEl.value = prev;
        return;
      }

      try {
        await apiFetch(`/api/users/${id}/gender`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ gender: next || null }),
        });
        selectEl.dataset.prev = next;
        showMsg(tt("genderUpdated", "Gender updated"), "success");
        loadActivity();
      } catch (err) {
        selectEl.value = prev;
        alert(err.message);
      }
    }

    async function toggleUser(id, action) {
      try {
        await apiFetch(`/api/users/${id}/${action}`, { method: "PATCH" });
        loadUsers();
      } catch (err) {
        alert(err.message);
      }
    }

    async function resetPassword(id, username) {
      const password = prompt(`${tt("password", "Password")} — ${username}:`);
      if (!password || password.length < 6) return;
      try {
        await apiFetch(`/api/users/${id}/password`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        showMsg(tt("passwordUpdated", "Password updated"), "success");
      } catch (err) {
        alert(err.message);
      }
    }

    async function loadActivity() {
      const container = document.getElementById("activityTable");
      if (!dbReady) {
        container.innerHTML = `<div class="empty">${tt("dbNotReady", "Fix the database before creating users")}</div>`;
        return;
      }
      try {
        const data = await apiFetch("/api/activity");
        if (!data.activity?.length) {
          container.innerHTML = `<div class="empty">${tt("noDataYet", "No data yet")}</div>`;
          return;
        }
        container.innerHTML = `
          <table>
            <thead><tr><th>${tt("colUsername", "Username")}</th><th>Action</th><th>Details</th><th>${tt("colCreated", "Created")}</th></tr></thead>
            <tbody>${data.activity.map((a) => `
              <tr>
                <td>${escapeHtml(a.username || "—")}</td>
                <td><code style="font-size:0.75rem">${escapeHtml(a.action)}</code></td>
                <td style="font-size:0.75rem;color:var(--text-muted)">${formatActivityDetails(a)}</td>
                <td>${new Date(a.created_at).toLocaleString(getLang() === "ar" ? "ar-KW" : "en")}</td>
              </tr>`).join("")}
            </tbody>
          </table>`;
      } catch (err) {
        container.innerHTML = `<div class="empty" style="color:var(--red)">${escapeHtml(err.message)}</div>`;
      }
    }

    document.getElementById("importBtn").addEventListener("click", async () => {
      if (!dbReady) return;
      const csv = document.getElementById("importCsv").value.trim();
      if (!csv) return;
      const users = csv.split("\n").map((line) => {
        const [username, password, role] = line.split(",").map((s) => s.trim());
        return { username, password, role: role || "user" };
      }).filter((u) => u.username);
      try {
        const res = await apiFetch("/api/users/import", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ users }),
        });
        const msgEl = document.getElementById("importMsg");
        msgEl.textContent = `${res.created} imported`;
        msgEl.className = "msg show success";
        document.getElementById("importCsv").value = "";
        loadUsers();
        loadActivity();
      } catch (err) {
        const msgEl = document.getElementById("importMsg");
        msgEl.textContent = err.hint ? `${err.message} — ${err.hint}` : err.message;
        msgEl.className = "msg show error";
      }
    });

    async function deleteUser(id, username) {
      if (!confirm(`${tt("deleteUserConfirm", "Delete user")} "${username}"?`)) return;

      try {
        await apiFetch(`/api/users/${id}`, { method: "DELETE" });
        loadUsers();
      } catch (err) {
        alert(err.message);
      }
    }

    function formatActivityDetails(entry) {
      const d = entry.details || {};
      if (entry.action === "gender_changed" && d.targetUsername) {
        return `${escapeHtml(d.targetUsername)}: ${genderLabel(d.from || null)} → ${genderLabel(d.to || null)}`;
      }
      if (d.targetUsername) return escapeHtml(d.targetUsername);
      if (d.username) return escapeHtml(d.username);
      return "—";
    }

    document.getElementById("genderFilter").addEventListener("change", (e) => {
      genderFilter = e.target.value;
      loadUsers();
    });

    document.getElementById("logoutBtn").addEventListener("click", logout);
    document.addEventListener("langchange", () => {
      applySetupLabels();
      checkStorage();
      loadUsers();
      loadActivity();
    });

    init();
  </script>
</body>
</html>
