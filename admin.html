<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الإدارة — حصالتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink: #f472b6;
      --pink-dark: #ec4899;
      --pink-light: #fce7f3;
      --pink-soft: #fdf2f8;
      --pink-muted: #fbcfe8;
      --text: #1e293b;
      --text-muted: #64748b;
      --white: #ffffff;
      --green: #22c55e;
      --red: #ef4444;
      --shadow-lg: 0 20px 60px rgba(244, 114, 182, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      background: linear-gradient(160deg, var(--pink-soft) 0%, var(--pink-light) 45%, var(--pink-muted) 100%);
      color: var(--text);
      padding: 24px 16px 40px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .top-bar h1 {
      font-family: "Amiri", serif;
      font-size: 1.8rem;
      color: var(--pink-dark);
    }

    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .top-actions a, .top-actions button {
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 99px;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      border: none;
      transition: background 0.15s;
    }

    .btn-outline {
      background: var(--white);
      color: var(--pink-dark);
      border: 2px solid var(--pink-muted) !important;
    }

    .btn-outline:hover { background: var(--pink-soft); }

    .btn-logout {
      background: var(--pink-light);
      color: var(--pink-dark);
    }

    .btn-logout:hover { background: var(--pink-muted); }

    .welcome {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card {
      background: var(--white);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow-lg);
      border: 2px solid var(--pink-light);
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--pink-dark);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    @media (max-width: 520px) {
      .form-row { grid-template-columns: 1fr; }
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--text-muted);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid var(--pink-light);
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--pink);
    }

    .btn-create {
      background: var(--pink);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 99px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 14px rgba(244, 114, 182, 0.35);
      transition: background 0.15s;
    }

    .btn-create:hover { background: var(--pink-dark); }

    .msg {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      display: none;
    }

    .msg.show { display: block; }
    .msg.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .msg.error { background: #fef2f2; color: var(--red); border: 1px solid #fecaca; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    th {
      text-align: right;
      padding: 10px 12px;
      border-bottom: 2px solid var(--pink-light);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.78rem;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid var(--pink-soft);
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .badge.admin { background: var(--pink-light); color: var(--pink-dark); }
    .badge.user { background: #f0fdf4; color: #166534; }

    .btn-delete {
      background: none;
      border: 1px solid #fecaca;
      color: var(--red);
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-delete:hover { background: #fef2f2; }

    .empty {
      text-align: center;
      color: var(--text-muted);
      padding: 24px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <div>
        <h1>لوحة الإدارة</h1>
        <div class="welcome">مرحباً، <span id="adminName">Admin</span></div>
      </div>
      <div class="top-actions">
        <a href="challenge.html" class="btn-outline">حصالتي</a>
        <a href="index.html" class="btn-outline">الرئيسية</a>
        <button class="btn-logout" id="logoutBtn">خروج</button>
      </div>
    </div>

    <div class="card">
      <h2>➕ إنشاء مستخدم جديد</h2>
      <form id="createForm">
        <div class="form-row">
          <div class="form-group">
            <label for="newUsername">اسم المستخدم</label>
            <input type="text" id="newUsername" required minlength="3" />
          </div>
          <div class="form-group">
            <label for="newPassword">كلمة المرور</label>
            <input type="password" id="newPassword" required minlength="6" />
          </div>
        </div>
        <div class="form-group" style="max-width:200px;margin-bottom:16px">
          <label for="newRole">الصلاحية</label>
          <select id="newRole">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button type="submit" class="btn-create">إنشاء المستخدم</button>
        <div class="msg" id="formMsg"></div>
      </form>
    </div>

    <div class="card">
      <h2>👥 المستخدمون</h2>
      <div id="usersTable">
        <div class="empty">Loading...</div>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    let currentUser = null;

    async function init() {
      currentUser = await requireAdmin();
      if (!currentUser) return;
      document.getElementById("adminName").textContent = currentUser.username;
      loadUsers();
    }

    async function loadUsers() {
      const container = document.getElementById("usersTable");
      try {
        const res = await fetch("/api/users");
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        if (data.users.length === 0) {
          container.innerHTML = '<div class="empty">No users yet.</div>';
          return;
        }

        container.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>اسم المستخدم</th>
                <th>الصلاحية</th>
                <th>تاريخ الإنشاء</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${data.users.map(u => `
                <tr>
                  <td><strong>${escapeHtml(u.username)}</strong></td>
                  <td><span class="badge ${u.role}">${u.role}</span></td>
                  <td>${new Date(u.created_at).toLocaleDateString()}</td>
                  <td>
                    ${u.id !== currentUser.id
                      ? `<button class="btn-delete" onclick="deleteUser(${u.id}, '${escapeHtml(u.username)}')">حذف</button>`
                      : '<span style="font-size:0.75rem;color:var(--text-muted)">أنت</span>'}
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>`;
      } catch (err) {
        container.innerHTML = `<div class="empty" style="color:var(--red)">${err.message}</div>`;
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function showMsg(text, type) {
      const el = document.getElementById("formMsg");
      el.textContent = text;
      el.className = `msg show ${type}`;
      setTimeout(() => el.classList.remove("show"), 4000);
    }

    document.getElementById("createForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("newUsername").value.trim();
      const password = document.getElementById("newPassword").value;
      const role = document.getElementById("newRole").value;

      const res = await fetch("/api/users", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password, role }),
      });

      const data = await res.json();
      if (!res.ok) {
        showMsg(data.error || "Failed to create user", "error");
        return;
      }

      showMsg(`User "${username}" created successfully!`, "success");
      document.getElementById("createForm").reset();
      loadUsers();
    });

    async function deleteUser(id, username) {
      if (!confirm(`Delete user "${username}"?`)) return;

      const res = await fetch(`/api/users/${id}`, { method: "DELETE" });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || "Failed to delete");
        return;
      }
      loadUsers();
    }

    document.getElementById("logoutBtn").addEventListener("click", logout);

    init();
  </script>
</body>
</html>
