<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الإدارة — حصالتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
  <script src="i18n.js"></script>
  <script src="theme.js"></script>
  <style>
    :root {
      --pink: #f472b6;
      --pink-dark: #ec4899;
      --pink-light: #fce7f3;
      --pink-soft: #fdf2f8;
      --pink-muted: #fbcfe8;
      --text: #1e293b;
      --text-muted: #64748b;
      --white: #ffffff;
      --green: #22c55e;
      --red: #ef4444;
      --shadow-lg: 0 20px 60px rgba(244, 114, 182, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      background: linear-gradient(160deg, var(--pink-soft) 0%, var(--pink-light) 45%, var(--pink-muted) 100%);
      color: var(--text);
      padding: 24px 16px 40px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .top-bar h1 {
      font-family: "Amiri", serif;
      font-size: 1.8rem;
      color: var(--pink-dark);
    }

    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .top-actions a, .top-actions button {
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 99px;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      border: none;
      transition: background 0.15s;
    }

    .btn-outline {
      background: var(--white);
      color: var(--pink-dark);
      border: 2px solid var(--pink-muted) !important;
    }

    .btn-outline:hover { background: var(--pink-soft); }

    .btn-logout {
      background: var(--pink-light);
      color: var(--pink-dark);
    }

    .btn-logout:hover { background: var(--pink-muted); }

    .welcome {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card {
      background: var(--white);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow-lg);
      border: 2px solid var(--pink-light);
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--pink-dark);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    @media (max-width: 520px) {
      .form-row { grid-template-columns: 1fr; }
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--text-muted);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid var(--pink-light);
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--pink);
    }

    .btn-create {
      background: var(--pink);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 99px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 14px rgba(244, 114, 182, 0.35);
      transition: background 0.15s;
    }

    .btn-create:hover { background: var(--pink-dark); }

    .msg {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      display: none;
    }

    .msg.show { display: block; }
    .msg.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .msg.error { background: #fef2f2; color: var(--red); border: 1px solid #fecaca; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    th {
      text-align: right;
      padding: 10px 12px;
      border-bottom: 2px solid var(--pink-light);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.78rem;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid var(--pink-soft);
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .badge.admin { background: var(--pink-light); color: var(--pink-dark); }
    .badge.user { background: #f0fdf4; color: #166534; }

    .btn-delete {
      background: none;
      border: 1px solid #fecaca;
      color: var(--red);
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-delete:hover { background: #fef2f2; }

    .empty {
      text-align: center;
      color: var(--text-muted);
      padding: 24px;
      font-size: 0.9rem;
    }

    .storage-banner {
      background: #fffbeb;
      border: 2px solid #fde68a;
      color: #92400e;
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .storage-banner.ok {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #166534;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="storageBanner" class="storage-banner" style="display:none"></div>
    <div class="top-bar">
      <div>
        <h1 data-i18n="adminPanel">لوحة الإدارة</h1>
        <div class="welcome"><span data-i18n="welcome">مرحباً،</span> <span id="adminName">Admin</span></div>
      </div>
      <div class="top-actions">
        <button type="button" class="lang-toggle">EN</button>
        <button class="theme-toggle" data-i18n-title="darkMode" title="Dark mode">🌙</button>
        <a href="challenge.html" class="btn-outline" data-i18n="appName">حصالتي</a>
        <a href="index.html" class="btn-outline" data-i18n="home">الرئيسية</a>
        <button class="btn-logout" id="logoutBtn" data-i18n="logout">خروج</button>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="createUser">➕ إنشاء مستخدم جديد</h2>
      <form id="createForm">
        <div class="form-row">
          <div class="form-group">
            <label for="newUsername" data-i18n="username">اسم المستخدم</label>
            <input type="text" id="newUsername" required minlength="3" />
          </div>
          <div class="form-group">
            <label for="newPassword" data-i18n="password">كلمة المرور</label>
            <input type="password" id="newPassword" required minlength="6" />
          </div>
        </div>
        <div class="form-group" style="max-width:200px;margin-bottom:16px">
          <label for="newRole" data-i18n="role">الصلاحية</label>
          <select id="newRole">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button type="submit" class="btn-create" data-i18n="createUserBtn">إنشاء المستخدم</button>
        <div class="msg" id="formMsg"></div>
      </form>
    </div>

    <div class="card">
      <h2 data-i18n="users">👥 المستخدمون</h2>
      <div id="usersTable">
        <div class="empty" data-i18n="loading">Loading...</div>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    let currentUser = null;

    async function init() {
      currentUser = await requireAdmin();
      if (!currentUser) return;
      document.getElementById("adminName").textContent = currentUser.username;
      checkStorage();
      loadUsers();
    }

    async function checkStorage() {
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        const banner = document.getElementById("storageBanner");
        if (!data.persistent || !data.ok) {
          banner.className = "storage-banner";
          banner.style.display = "block";
          const hint = data.hint || data.dbError || "";
          banner.innerHTML = `<strong>${t("storageWarningTitle")}</strong>${t("storageWarningBody")}${hint ? `<br><small>${hint}</small>` : ""}`;
        } else if (data.storage === "supabase") {
          banner.className = "storage-banner ok";
          banner.style.display = "block";
          banner.innerHTML = `<strong>${t("storageOkTitle")}</strong>${t("storageOkBody")} (${data.db?.users ?? 0} ${t("storageUsers")})`;
        } else {
          banner.style.display = "none";
        }
      } catch { /* ignore */ }
    }

    async function loadUsers() {
      const container = document.getElementById("usersTable");
      try {
        const data = await apiFetch("/api/users");

        if (data.users.length === 0) {
          container.innerHTML = `<div class="empty">${t("noUsers")}</div>`;
          return;
        }

        container.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>${t("colUsername")}</th>
                <th>${t("colRole")}</th>
                <th>${t("colCreated")}</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${data.users.map(u => `
                <tr>
                  <td><strong>${escapeHtml(u.username)}</strong></td>
                  <td><span class="badge ${u.role}">${u.role}</span></td>
                  <td>${new Date(u.created_at).toLocaleDateString(getLang() === "ar" ? "ar-KW" : "en")}</td>
                  <td>
                    ${u.id !== currentUser.id
                      ? `<button class="btn-delete" data-id="${u.id}" data-username="${escapeHtml(u.username)}">${t("delete")}</button>`
                      : `<span style="font-size:0.75rem;color:var(--text-muted)">${t("you")}</span>`}
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>`;

        container.querySelectorAll(".btn-delete").forEach((btn) => {
          btn.addEventListener("click", () => {
            deleteUser(Number(btn.dataset.id), btn.dataset.username);
          });
        });
      } catch (err) {
        container.innerHTML = `<div class="empty" style="color:var(--red)">${err.message}</div>`;
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showMsg(text, type) {
      const el = document.getElementById("formMsg");
      el.textContent = text;
      el.className = `msg show ${type}`;
      setTimeout(() => el.classList.remove("show"), 4000);
    }

    document.getElementById("createForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("newUsername").value.trim();
      const password = document.getElementById("newPassword").value;
      const role = document.getElementById("newRole").value;

      try {
        await apiFetch("/api/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, role }),
        });
        showMsg(t("userCreated"), "success");
      } catch (err) {
        showMsg(err.message, "error");
        return;
      }
      document.getElementById("createForm").reset();
      loadUsers();
    });

    async function deleteUser(id, username) {
      if (!confirm(`${t("deleteUserConfirm")} "${username}"?`)) return;

      try {
        await apiFetch(`/api/users/${id}`, { method: "DELETE" });
        loadUsers();
      } catch (err) {
        alert(err.message);
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", logout);
    document.addEventListener("langchange", () => { checkStorage(); loadUsers(); });

    init();
  </script>
</body>
</html>
